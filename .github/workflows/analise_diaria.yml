name: Relatório Diário 3C Plus & Gemini

# Agendado de terca a sabado as 07:37 BRT (10:37 UTC)
on:
  schedule:
    - cron: '37 10 * * 2-6'
  workflow_dispatch:

jobs:
  executar-analise:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Executar Consolidação e Envio ao Google Docs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_3C_PLUS: ${{ secrets.TOKEN_3C_PLUS }}
          GOOGLE_DOCS_WEBHOOK_URL: ${{ secrets.GOOGLE_DOCS_WEBHOOK_URL }}
        run: |
          python main.py

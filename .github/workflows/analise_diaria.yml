name: Relatório Diário 3C Plus & Gemini

on:
  schedule:
    # 09:15 UTC = 06:15 Horário de Brasília (Terça a Sábado)
    - cron: '15 9 * * 2-6'
  workflow_dispatch:
    inputs:
      data_manual:
        description: 'Data opcional para processar (DD/MM/YYYY)'
        required: false
        default: ''
jobs:
  executar-analise:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests google-generativeai

      - name: Executar Consolidação e Envio ao Google Docs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_3C_PLUS: ${{ secrets.TOKEN_3C_PLUS }}
          GOOGLE_DOCS_WEBHOOK_URL: ${{ secrets.GOOGLE_DOCS_WEBHOOK_URL }}
        run: |
          python main.py
